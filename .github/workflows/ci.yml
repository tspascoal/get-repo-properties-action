name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

env:
  organization: get-user-teams-membership-tests
  PROPERTY_ONE_EXPECTED: valueofpropertyone

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always() && github.actor != 'dependabot[bot]'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          check_name: Tests Results
          files: 'test-results/jest/junit.xml'
          report_individual_runs: true
          deduplicate_classes_by_file_name: false

      - name: Report Coverage
        uses: ArtiomTr/jest-coverage-report-action@262a7bb0b20c4d1d6b6b026af0f008f78da72788 # v2.3.1
        if: always() && github.actor != 'dependabot[bot]'

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Get Token
        id: get_workflow_token
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ env.organization }}
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build dist/ Directory
        id: build
        run: npm run bundle

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          owner: get-user-teams-membership-tests
          repo: properties
          token:  ${{ steps.get_workflow_token.outputs.token }}

      - name: Verify test-action property_one output
        env:
          PROPERTY_ONE_VALUE: ${{ steps.test-action.outputs.property_one }}
        run: |
          echo "property_one=$PROPERTY_ONE_VALUE"
          test "$PROPERTY_ONE_VALUE" = "$PROPERTY_ONE_EXPECTED"

      - name: Verify multi-select property output
        env:
          ACTUAL_VALUE: ${{ steps.test-action.outputs.property_array }}
        run: printf '%s' "$ACTUAL_VALUE" | jq -e 'sort == ["alpha", "beta"]'

      - name: Test Local Action Env
        uses: ./
        with:
          set-env: true
          owner: get-user-teams-membership-tests
          repo: properties
          token:  ${{ steps.get_workflow_token.outputs.token }}

      - name: Verify test-action property_one env variable
        env:
          PROPERTY_ONE_VALUE: ${{ env.property_one }}
        run: |
          echo "property_one=$PROPERTY_ONE_VALUE"
          test "$PROPERTY_ONE_VALUE" = "$PROPERTY_ONE_EXPECTED"

      - name: Verify multi-select environment variable
        env:
          ACTUAL_VALUE: ${{ env.property_array }}
        run: printf '%s' "$ACTUAL_VALUE" | jq -e 'sort == ["alpha", "beta"]'
